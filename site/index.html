<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Pub Round</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"><style id="css">:root{
  /* light: white bg, light grey panels */
  --bg:#ffffff; --panel:#f4f4f5; --panel-2:#e9e9ec; --border:#e4e4e7;
  --fg:#18181b; --muted:#71717a; --ring:#a1a1aa; --inv:#ffffff;
  --radius:12px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1b1b1e; --panel:#2c2c31; --panel-2:#3a3a40; --border:#41414a;
    --fg:#fafafa; --muted:#a1a1aa; --ring:#71717a; --inv:#18181b;
  }
}
:root[data-theme="dark"]{
  --bg:#1b1b1e; --panel:#2c2c31; --panel-2:#3a3a40; --border:#41414a;
  --fg:#fafafa; --muted:#a1a1aa; --ring:#71717a; --inv:#18181b;
}
:root{--gold:#d99a00;--green:#34c759;--x:#a1a1aa}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--gold:#f5b82e}}
:root[data-theme="dark"]{--gold:#f5b82e}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;background:var(--bg);color:var(--fg);
  font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased;
}
.wrap{max-width:520px;margin:0 auto;padding:20px 16px 64px}
svg.i{width:1em;height:1em;display:block;flex:none}

.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:18px}
h1{font-size:26px;font-weight:700;letter-spacing:-.025em;margin:0}
.btns{display:flex;gap:8px}
.btn{
  height:36px;display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:0 12px;border-radius:8px;border:1px solid var(--border);
  background:var(--bg);color:var(--fg);font:inherit;font-size:14px;font-weight:500;cursor:pointer;
}
.btn:hover{background:var(--panel)}
.btn.icon{width:36px;padding:0;font-size:18px}
.btn.on{background:var(--panel)}

.group{display:flex;align-items:center;margin:0 0 22px}
.group label{
  position:relative;display:inline-block;border-radius:50%;cursor:pointer;margin-left:-6px;
}
.group label:first-child{margin-left:0}
.group .av{box-shadow:0 0 0 3px var(--bg)}
.group input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0}

.av{
  width:var(--s,40px);height:var(--s,40px);border-radius:50%;flex:none;
  display:inline-flex;align-items:center;justify-content:center;
  font-weight:600;font-size:calc(var(--s,40px)*.4);
  background:var(--c,var(--panel-2));color:#fff;overflow:hidden;
}
.av.neutral{background:var(--panel-2);color:var(--fg)}
.stack{display:flex;flex-direction:column;flex:none}
.stack .av{box-shadow:0 0 0 2px var(--panel)}
.stack .av + .av{margin-top:-8px}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.av svg.i{font-size:calc(var(--s,40px)*.5)}

/* icon picker card */
.card{
  background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
  padding:14px;margin-bottom:22px;
}
.card h2{font-size:14px;font-weight:600;margin:0 0 2px}
.card p{margin:0 0 12px;color:var(--muted);font-size:13px}
.pick-label{font-size:12px;color:var(--muted);font-weight:500;margin:10px 0 6px}
.picks{display:flex;flex-wrap:wrap;gap:8px}
.pick{
  min-width:76px;height:64px;padding:0 8px;border-radius:10px;border:1px solid var(--border);
  background:var(--bg);color:var(--fg);font:inherit;font-size:22px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
}
.pick[aria-pressed="true"]{border-color:var(--fg);box-shadow:0 0 0 1px var(--fg)}
.pick span{font-size:11px;color:var(--muted);line-height:1}

.month{
  font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);
  margin:24px 0 8px 2px;font-weight:600;
}
.item{
  display:flex;align-items:center;gap:12px;
  background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
  padding:12px 14px;margin-bottom:8px;position:relative;
}
.item.next{border:2px solid var(--green);padding:11px 13px}
.tick{
  width:40px;height:40px;border-radius:50%;flex:none;
  border:2px solid var(--ring);background:var(--bg);padding:0;color:var(--inv);
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  transition:background .15s,border-color .15s,transform .1s;
}
.tick svg{width:22px;height:22px;opacity:0}
.tick svg path{stroke-width:2.5;stroke-dasharray:30;stroke-dashoffset:30}
.tick.done{background:var(--fg);border-color:var(--fg);cursor:default}
.tick.done svg{opacity:1}
.tick.done svg path{stroke-dashoffset:0}
.tick.pop{animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
.tick.pop svg path{animation:draw .35s .1s ease-out both}
.next .tick:hover{border-color:var(--fg)}
.next .tick:active{transform:scale(.92)}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.22)}100%{transform:scale(1)}}
@keyframes draw{from{stroke-dashoffset:30}to{stroke-dashoffset:0}}

.txt{flex:1;min-width:0}
.title{font-size:16px;font-weight:600;letter-spacing:-.01em;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.date{font-size:13px;color:var(--fg);font-weight:500;margin-top:1px}
.daterow{display:flex;align-items:center;gap:10px;margin-top:6px}
.daterow .date-in{margin-top:0}
.badge{
  font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;
  background:var(--fg);color:var(--inv);
}
.badge.soft{background:var(--panel-2);color:var(--fg)}
.tags{display:flex;flex-wrap:nowrap;gap:6px;margin-top:8px}
.tag{
  display:inline-flex;align-items:center;gap:5px;font-size:12px;white-space:nowrap;flex:none;
  border:1px solid var(--border);background:var(--bg);border-radius:999px;padding:3px 8px 3px 6px;
}
.tag svg.i{font-size:14px}
.tag em{font-style:normal;color:var(--muted)}
.tag b{font-weight:600}
.date-in{
  margin-top:6px;font:inherit;font-size:14px;color:var(--fg);color-scheme:light dark;
  background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:5px 8px;
}
.undo{
  position:absolute;top:2px;right:2px;background:none;border:0;color:var(--x);
  cursor:pointer;padding:9px;font-size:14px;line-height:0;
}
.undo svg{stroke-width:3.5}
button:focus-visible,input:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
canvas#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
input[type=file]{display:none}
[hidden]{display:none!important}
@media (max-width:359px){.tag em{display:none}}
@media (prefers-reduced-motion:reduce){.tick.pop,.tick.pop svg path{animation:none}}

.note{margin:-8px 0 16px;font-size:13px;color:var(--muted)}
.tick:disabled{cursor:default;color:var(--inv);opacity:1}
.next .tick:disabled:hover{border-color:var(--ring)}
.group.ro label{cursor:default}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  background:var(--fg);color:var(--inv);padding:8px 14px;border-radius:999px;font-size:13px;z-index:60}

  var THEME_KEY = 'pub-round-theme', UI_KEY = 'pub-round-ui';

  var SKEL = '<div class="wrap"><div class="top"><h1>Pub Round</h1><div class="btns"><button class="btn" id="iconsBtn" aria-expanded="true">Tag icons</button><button class="btn icon" id="themeBtn" aria-label="Toggle light and dark theme"></button></div></div><div class="note" id="note" hidden>View only. This page updates by itself when the list changes.</div><div class="group" id="group"></div><div class="card" id="picker"></div><div id="list"></div></div>';
  var HEAD = '<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Pub Round</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">';

  document.getElementById('root').innerHTML = SKEL;

  function clone(o){ return JSON.parse(JSON.stringify(o)); }
  var seed = JSON.parse(document.getElementById('state').textContent);
  var state = clone(seed);
  if(!state.photos) state.photos = {};
  if(!state.icons) state.icons = {};
  if(DRINK_OPTS.indexOf(state.icons.drinks)<0) state.icons.drinks = 'beer';
  if(FOOD_OPTS.indexOf(state.icons.food)<0) state.icons.food = 'hamburger';

  var STORE = 'pub-round-data', standalone = false;
  var artifactNS = null, writer = false, ready = false, pubTimer = null, justAdded = null, pickerOpen = true;
  try{ var u0 = JSON.parse(localStorage.getItem(UI_KEY)||'null'); if(u0 && typeof u0.open==='boolean') pickerOpen = u0.open; }catch(e){}

  /* ---------- publishing (this is how changes are saved for everyone) ---------- */
  function buildDoc(st){
    var json = JSON.stringify(st).replace(/</g,'\\u003c');
    return '<!doctype html><html lang="en"><head>'+HEAD+'<style id="css">'+document.getElementById('css').textContent+'</style></head><body><div id="root"></div><canvas id="fx"></canvas><script type="application/json" id="state">'+json+'<\/script><script id="app">'+document.getElementById('app').textContent+'<\/script></body></html>';
  }
  function toast(msg){
    var t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
    document.body.appendChild(t); setTimeout(function(){ t.remove(); }, 3500);
  }
  function loadLocal(){
    try{
      var raw = localStorage.getItem(STORE);
      if(raw){ var d = JSON.parse(raw); if(d && d.history){ state = d; if(!state.photos) state.photos = {}; if(!state.icons) state.icons = {}; if(DRINK_OPTS.indexOf(state.icons.drinks)<0) state.icons.drinks='beer'; if(FOOD_OPTS.indexOf(state.icons.food)<0) state.icons.food='hamburger'; } }
    }catch(e){}
  }
  function commit(delay){
    if(standalone){ doPublish(); return; }
    clearTimeout(pubTimer);
    pubTimer = setTimeout(doPublish, delay);
  }
  function doPublish(){
    if(standalone){
      try{ localStorage.setItem(STORE, JSON.stringify(state)); }catch(e){ toast('Could not save on this device.'); }
      return;
    }
    if(!artifactNS) return;
    artifactNS.publish(buildDoc(state)).catch(function(err){
      var c = err && err.code;
      if(c==='conflict') return;
      if(['not_writer','not_granted','consent_required','capability_disabled','capability_removed','not_declared'].indexOf(c)>=0){
        writer = false; state = clone(seed); render();
      } else {
        toast('Could not save. Try again.');
      }
    });
  }

  /* ---------- theme ---------- */
  var root = document.documentElement;
  function currentTheme(){ return root.getAttribute('data-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); }
  function applyTheme(t){ root.setAttribute('data-theme', t); document.getElementById('themeBtn').innerHTML = ico(t==='dark' ? 'sun' : 'moon'); }
  try{ var st0 = localStorage.getItem(THEME_KEY); if(st0==='dark'||st0==='light') root.setAttribute('data-theme', st0); }catch(e){}
  applyTheme(currentTheme());
  document.getElementById('themeBtn').addEventListener('click', function(){
    var n = currentTheme()==='dark' ? 'light' : 'dark';
    applyTheme(n);
    try{ localStorage.setItem(THEME_KEY, n); }catch(e){}
  });
  document.getElementById('iconsBtn').addEventListener('click', function(){
    pickerOpen = !pickerOpen;
    try{ localStorage.setItem(UI_KEY, JSON.stringify({open:pickerOpen})); }catch(e){}
    renderPicker();
  });

  /* ---------- helpers ---------- */
  function pad(n){return n<10?'0'+n:''+n}
  function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
  function nextFriday(){ var d = new Date(); while(d.getDay()!==5) d.setDate(d.getDate()+1); return iso(d); }
  function parse(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2])}
  function ord(n){ var v=n%100; if(v>=11&&v<=13) return n+'th'; return n+({1:'st',2:'nd',3:'rd'}[n%10]||'th'); }
  var MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  var DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  function nice(s){var d=parse(s);return DAYS[d.getDay()]+' '+ord(d.getDate())+' '+MON[d.getMonth()]}
  function dayName(s){return DAYS[parse(s).getDay()]}
  function esc(t){return String(t).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function sorted(){ return state.history.slice().sort(function(a,b){return a.date<b.date?1:a.date>b.date?-1:0}); }
  function lastWho(){ var s = sorted(); for(var i=0;i<s.length;i++){ if(s[i].who) return s[i].who; } return null; }
  function nextWho(){ var l = lastWho(); return l ? ORDER[(ORDER.indexOf(l)+1)%3] : ORDER[0]; }
  function roles(who){ var i = ORDER.indexOf(who); return {drinks:who, food:ORDER[(i+1)%3]}; }
  function effectiveNext(){
    if(state.nextDate) return state.nextDate;
    var d = nextFriday(), h = sorted();
    if(h.length && d <= h[0].date){ var x = parse(h[0].date); x.setDate(x.getDate()+7); d = iso(x); }
    return d;
  }

  function avatar(who, size){
    var p = state.photos[who] || DEFAULT_PHOTOS[who];
    return '<span class="av" style="--s:'+size+'px;--c:'+COLORS[who]+'">'+(p ? '<img alt="" src="'+p+'">' : NAMES[who].charAt(0))+'</span>';
  }
  function tags(who){
    var r = roles(who);
    return '<div class="tags">'
      + '<span class="tag">'+ico(state.icons.drinks)+'<em>Drinks</em><b>'+NAMES[r.drinks]+'</b></span>'
      + '<span class="tag">'+ico(state.icons.food)+'<em>Food</em><b>'+NAMES[r.food]+'</b></span>'
      + '</div>';
  }
  function pair(who){ var r = roles(who); return NAMES[r.drinks]+' & '+NAMES[r.food]; }
  function stack(who){ var r = roles(who); return '<div class="stack">'+avatar(r.drinks,34)+avatar(r.food,34)+'</div>'; }
  function checkSvg(){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+ICONS.check+'</svg>'}

  function renderPicker(){
    var el = document.getElementById('picker'), canEdit = ready && writer;
    el.hidden = !(pickerOpen && canEdit);
    var b = document.getElementById('iconsBtn');
    b.hidden = !canEdit;
    b.classList.toggle('on', pickerOpen);
    b.setAttribute('aria-expanded', pickerOpen);
    function row(kind, opts){
      return '<div class="picks">'+opts.map(function(n){
        return '<button class="pick" data-kind="'+kind+'" data-icon="'+n+'" aria-pressed="'+(state.icons[kind]===n)+'" aria-label="'+OPT_NAMES[n]+'" title="'+OPT_NAMES[n]+'">'+ico(n)+'<span>'+OPT_NAMES[n]+'</span></button>';
      }).join('')+'</div>';
    }
    el.innerHTML = '<h2>Tag icons</h2><p>Pick an icon for each tag. Icons are from Lucide, the shadcn icon set.</p>'
      + '<div class="pick-label">Drinks</div>'+row('drinks',DRINK_OPTS)
      + '<div class="pick-label">Food</div>'+row('food',FOOD_OPTS);
  }

  function render(){
    var canEdit = ready && writer;
    var g = document.getElementById('group');
    g.className = 'group' + (canEdit ? '' : ' ro');
    g.innerHTML = ORDER.map(function(w){
      return '<label aria-label="'+(canEdit ? 'Add photo for ' : '')+NAMES[w]+'">'+avatar(w,46)
        + (canEdit ? '<input class="photo-in" type="file" accept="image/*" data-who="'+w+'">' : '')+'</label>';
    }).join('');
    document.getElementById('note').hidden = !(ready && !writer);
    renderPicker();

    var nd = effectiveNext(), nw = nextWho();
    var hist = sorted(), latestId = null;
    for(var i=0;i<hist.length;i++){ if(hist[i].who){ latestId = hist[i].id; break; } }
    var items = [{type:'next', date:nd, who:nw}].concat(hist.map(function(h){
      return {type:'done', date:h.date, who:h.who, note:h.note, id:h.id};
    }));

    var nowY = new Date().getFullYear(), lastLabel = '', out = '';
    items.forEach(function(it){
      var d = parse(it.date);
      var label = MONTHS[d.getMonth()] + (d.getFullYear()!==nowY ? ' '+d.getFullYear() : '');
      if(label!==lastLabel){ out += '<div class="month">'+label+'</div>'; lastLabel = label; }

      if(it.type==='next'){
        out += '<div class="item next">'
          + '<button class="tick" id="tick" aria-label="Mark as paid"'+(canEdit?'':' disabled')+'>'+checkSvg()+'</button>'
          + stack(it.who)
          + '<div class="txt"><div class="title">'+pair(it.who)+' <span class="badge">Next</span></div>'
          + tags(it.who)
          + (canEdit
              ? '<div class="daterow"><input class="date-in" type="date" id="nextDate" value="'+it.date+'" aria-label="Date"><span class="date" id="nextDay">'+dayName(it.date)+'</span></div>'
              : '<div class="date" style="margin-top:6px">'+nice(it.date)+'</div>')
          + '</div></div>';
      } else {
        var pop = (justAdded===it.id) ? ' pop' : '';
        out += '<div class="item">'
          + '<button class="tick done'+pop+'" tabindex="-1" aria-label="Paid">'+checkSvg()+'</button>'
          + (it.who ? stack(it.who) : '<div class="stack"><span class="av neutral" style="--s:34px">'+ico('users')+'</span></div>')
          + '<div class="txt"><div class="title">'+(it.who ? pair(it.who) : esc(it.note))+(it.who?'':' <span class="badge soft">Special night</span>')+'</div>'
          + '<div class="date">'+nice(it.date)+'</div>'
          + (it.who ? tags(it.who) : '')
          + '</div>'
          + ((canEdit && it.id===latestId) ? '<button class="undo" data-undo="'+it.id+'" aria-label="Undo">'+ico('x')+'</button>' : '')
          + '</div>';
      }
    });
    document.getElementById('list').innerHTML = out;
  }

  /* ---------- events ---------- */
  document.addEventListener('click', function(e){
    if(!(ready && writer)) return;
    var t = e.target.closest('button');
    if(!t) return;
    if(t.classList.contains('pick')){
      state.icons[t.dataset.kind] = t.dataset.icon; render(); commit(1500); return;
    }
    if(t.id==='tick'){
      var r = t.getBoundingClientRect(), cx = r.left+r.width/2, cy = r.top+r.height/2;
      var id = 'n'+Date.now();
      state.history.push({id:id,date:effectiveNext(),who:nextWho(),note:''});
      state.nextDate = null;
      justAdded = id; render(); burst(cx, cy);
      setTimeout(function(){justAdded=null},800);
      commit(1900);
      return;
    }
    if(t.dataset.undo){
      state.history = state.history.filter(function(h){return h.id!==t.dataset.undo});
      state.nextDate = null; render(); commit(1200); return;
    }
  });
  document.addEventListener('change', function(e){
    if(!(ready && writer)) return;
    var inp = e.target;
    if(inp.id==='nextDate' && inp.value){
      state.nextDate = inp.value;
      var nd = document.getElementById('nextDay'); if(nd) nd.textContent = dayName(inp.value);
      commit(1800); return;
    }
    if(inp.classList && inp.classList.contains('photo-in')){
      var f = inp.files && inp.files[0], who = inp.dataset.who;
      if(!f || !who) return;
      var reader = new FileReader();
      reader.onload = function(){
        var img = new Image();
        img.onload = function(){
          var sz = 192, c = document.createElement('canvas'); c.width = c.height = sz;
          var m = Math.min(img.width, img.height);
          c.getContext('2d').drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,sz,sz);
          state.photos[who] = c.toDataURL('image/jpeg',0.85);
          render(); commit(800);
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(f);
    }
  });

  /* confetti + coins */
  var cv = document.getElementById('fx'), ctx = cv.getContext('2d');
  var parts = [], running = false, DPR = Math.min(window.devicePixelRatio||1, 2);
  function fit(){cv.width = innerWidth*DPR; cv.height = innerHeight*DPR;}
  fit(); addEventListener('resize', fit);
  var CONF = ['#f5b82e','#ffffff','#34c759','#4c8df6','#ef5b5b','#b980f0'];

  function burst(x,y){
    if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    for(var i=0;i<70;i++){
      var a = -Math.PI/2 + (Math.random()-.5)*2.6, v = 6+Math.random()*9;
      parts.push({k:'c',x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,w:6+Math.random()*6,h:4+Math.random()*5,
        r:Math.random()*6,vr:(Math.random()-.5)*.4,col:CONF[i%CONF.length],life:0});
    }
    for(var j=0;j<22;j++){
      var b = -Math.PI/2 + (Math.random()-.5)*2.2, u = 8+Math.random()*10;
      parts.push({k:'m',x:x,y:y,vx:Math.cos(b)*u,vy:Math.sin(b)*u,rad:9+Math.random()*5,ph:Math.random()*6,vph:.25+Math.random()*.2,life:0});
    }
    if(!running){running = true; requestAnimationFrame(tick);}
  }
  function tick(){
    ctx.clearRect(0,0,cv.width,cv.height);
    ctx.save(); ctx.scale(DPR,DPR);
    parts = parts.filter(function(p){return p.life<150 && p.y<innerHeight+40});
    parts.forEach(function(p){
      p.life++; p.vy += .35; p.vx *= .992; p.x += p.vx; p.y += p.vy;
      ctx.globalAlpha = Math.max(p.life>110 ? 1-(p.life-110)/40 : 1, 0);
      if(p.k==='c'){
        p.r += p.vr; ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r);
        ctx.fillStyle = p.col; ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h); ctx.restore();
      } else {
        p.ph += p.vph; var sx = Math.abs(Math.cos(p.ph));
        ctx.save(); ctx.translate(p.x,p.y); ctx.scale(Math.max(sx,.12),1);
        ctx.beginPath(); ctx.arc(0,0,p.rad,0,Math.PI*2);
        ctx.fillStyle = '#f5b82e'; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = '#b57b0a'; ctx.stroke();
        if(sx>.5){
          ctx.fillStyle = '#b57b0a'; ctx.font = 'bold '+(p.rad*1.1)+'px system-ui,sans-serif';
          ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('\u00A3',0,1);
        }
        ctx.restore();
      }
    });
    ctx.restore();
    if(parts.length){ requestAnimationFrame(tick); } else { running = false; ctx.clearRect(0,0,cv.width,cv.height); }
  }


  render();

  /* find out whether this viewer can save changes */
  (function(){
    var c = window.claude;
    if(!c || !c.use){ standalone = true; writer = true; ready = true; loadLocal(); render(); return; }
    Promise.all([c.use('artifact'), c.use('user')]).then(function(r){
      artifactNS = r[0];
      var u = r[1];
      if(!artifactNS) writer = false;
      else if(u && typeof u.canEdit === 'function') writer = !!u.canEdit();
      else writer = true;
      ready = true; render();
    }).catch(function(){ ready = true; render(); });
  })();
})();
</script></body></html>
